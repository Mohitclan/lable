<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Design A4 sticker label sheets, fill them from a spreadsheet or PDF, and print at exact size.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cg fill='%23fff'%3E%3Crect x='8' y='7' width='7' height='8' rx='1.5'/%3E%3Crect x='17' y='7' width='7' height='8' rx='1.5'/%3E%3Crect x='8' y='17' width='7' height='8' rx='1.5'/%3E%3Crect x='17' y='17' width='7' height='8' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <title>Label Studio — A4 Label Designer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>
      <span class="brand-name">Label Studio</span>
    </div>

    <nav class="steps-nav" aria-label="Steps">
      <button type="button" class="tab" data-mode="sheet"><span class="num">1</span><span class="full">Layout</span><span class="short">Layout</span></button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button type="button" class="tab" data-mode="label"><span class="num">2</span><span class="full">Design</span><span class="short">Design</span></button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button type="button" class="tab" data-mode="data"><span class="num">3</span><span class="full">Data <em>optional</em></span><span class="short">Data</span></button>
    </nav>

    <div class="spacer"></div>
    <span id="saveStatus" class="save-status"></span>
    <div class="icon-group">
      <button type="button" id="btnUndo" class="btn icon ghost" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" id="btnRedo" class="btn icon ghost" title="Redo (Ctrl+Y)" aria-label="Redo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="menu">
      <button type="button" id="btnLibrary" class="btn ghost" aria-haspopup="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        <span class="lib-text">Library</span>
      </button>
      <div class="menu-pop" id="libraryMenu" hidden>
        <button type="button" data-act="templates">Saved label designs</button>
        <button type="button" data-act="layouts">Saved sheet layouts</button>
        <button type="button" data-act="company">Company profile</button>
        <hr>
        <button type="button" data-act="export">Export backup (.json)</button>
        <button type="button" data-act="import">Import backup…</button>
      </div>
    </div>
    <button type="button" id="btnPrint" class="btn icon ghost" title="Print (Ctrl+P)" aria-label="Print"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg></button>
    <button type="button" id="btnPdf" class="btn primary with-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span id="btnPdfText">Download PDF</span></button>
  </header>

  <main class="workspace">
    <aside class="panel left" aria-label="Settings">
      <div class="sheet-head"><strong id="leftTitle">Sheet layout</strong><button type="button" class="btn icon ghost" data-close title="Close" aria-label="Close">✕</button></div>
      <div id="leftPanel"></div>
    </aside>
    <section class="stage">
      <div class="stage-bar" id="stageBar"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Design canvas"></svg>
      </div>
    </section>
    <aside class="panel right" aria-label="Properties">
      <div class="sheet-head"><strong id="rightTitle">Properties</strong><button type="button" class="btn icon ghost" data-close title="Close" aria-label="Close">✕</button></div>
      <div id="rightPanel"></div>
      <div id="warnings"></div>
    </aside>
  </main>

  <!-- Phones: tab bar that opens the panels as slide-up sheets. -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Panels">
    <button type="button" data-sheet="left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span id="navLeft">Layout</span></button>
    <button type="button" data-sheet="right"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg><span id="navRight">Sheet</span><span class="bn-badge" id="navBadge" hidden></span></button>
    <button type="button" id="navPrint"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span>Print</span></button>
    <button type="button" id="navPdf" class="bn-primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>Download</span></button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileBackup" accept="application/json,.json" hidden>

  <!-- Libraries are bundled in vendor/ so the app works offline (Excel support loads on demand). -->
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/label.js"></script>
  <script src="js/data.js"></script>
  <script src="js/seeds.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
